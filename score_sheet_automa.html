<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="utf-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <title>Wyrmspan Utilities - Score Sheet (Automa)</title>
        <link rel="icon" href="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/box_art/base_game.png" type="image/png">

        <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
        <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link href="https://fonts.googleapis.com/css2?family=Amarante&display=swap" rel="stylesheet">

        <link rel="stylesheet" type="text/css" href="css/styles.css" media="screen" />
        <link rel="stylesheet" type="text/css" href="css/themes.css" media="screen" />

        <script src="js/colour_filter_computer.js"></script>
        <script src="js/no_sleep.min.js"></script>
        <script src="js/settings.js"></script>
        <script src="js/misc_scripts.js"></script>
        <script src="js/score_sheet_automa_scripts.js"></script>
    </head>

    <body class="parallax" id="automa_score_sheet_body">

        <!--
        Data attributes of automa_score_sheet_body:
            automa_points_per_dragon_card
        -->

        <form class="google_form" id="google_form" name="google_form"  target="_top" method="POST" action="https://script.google.com/macros/s/AKfycbwHfda9GFnKFvMem6YLQxmeTCjQYSASG1E46ulA6-cmWxoSO137pCEl2m-luSEp9nAmpg/exec">

            <div class="container-fluid" id="container_header">

                <div class="row justify-content-center align-items-center" style="height:7vh;" id="row_header">

                    <div class="col header-background" style="height:7vh;"></div>

                    <div class="row justify-content-between align-items-center" style="height:7vh;" id="row_header_1">

                        <div class="col-auto m-0 px-0 text-center h1">Score sheet - Automa</div>

                        <div class="col-auto p-0 text-end">
                            <a class="btn nav-button btn-return" href="./index.html" id="button_return_to_home_page">Return home</a>
                        </div>
                    </div>
                </div>

                <div class="row justify-content-between align-items-center" style="height:7vh;">

                    <div class="card-header py-1 text-center" id="row_difficulty_header">
                        <h2 class="p-0 m-0 h2">Automa options</h2>
                    </div>

                    <div class="card-body p-1">

                        <div class="row p-0 margin_auto" id="row_automa_difficulty">

                            <div class="col-auto">
                                Difficulty:
                            </div>
            
                            <div class="col-3 p-0">
                                
                                <fieldset class="row p-0 justify-content-between margin_auto" id="row_automa_difficulty" name="automa_difficulty">
            
                                    <label class="col-4 p-0">
                                        <input type="radio" id="radio_automa_difficulty_1" name="automa_difficulty" 
                                            value="1"> 1
                                    </label>
            
                                    <label class="col-4 p-0">
                                        <input type="radio" id="radio_automa_difficulty_2" name="automa_difficulty" 
                                            value="2"> 2
                                    </label>
            
                                    <label class="col-4 p-0">
                                        <input type="radio" id="radio_automa_difficulty_3" name="automa_difficulty" 
                                            value="3"> 3
                                    </label>
                                </fieldset>
                            </div>

                            <div class="col-4">
                                Ravel mode:
                            </div>
            
                            <div class="col-1">
                                
                                <input id="col_ravel_mode_checkbox_hidden" name="ravel_mode" type="hidden" value="no"></input>
                                <input id="col_ravel_mode_checkbox" name="ravel_mode" type="checkbox" value="yes">
                            </div>
                        </div>
                    </div>
                </div>
            </div>

            <div class="container-fluid" id="container_body">

                <div class="row p-0 justify-content-center margin_auto" style="height:75vh;margin-top:1vh;margin-bottom:2vh;" id="row_score_sheet">

                    <table class="col-12 mb-0 table table-bordered">

                        <thead>

                            <tr>
                                <th class="cell-info" style="width:40%;">Player</th>

                                <th class="cell-info" style="width:10%"></th>

                                <th class="cell-info" style="width:10%"></th>

                                <th class="cell-info" style="width:40%; text-align: right;">Automa</th>
                            </tr>
                        </thead>
                    
                        <tbody>

                            <tr>

                                <th class="cell-info">Markers on <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/dragon_guild.png"></th>

                                <td><input type="number" id="cell_player_markers_on_dragon_guild" name="player_markers_on_dragon_guild" min="0" required></td>

                                <td class="cell-info">
                                    <input type="number" id="cell_automa_dragon_cards" name="automa_dragon_cards" min="0" required>
                                </td>

                                <th class="cell-info">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> per <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/dragon_card.png"></th>
                            </tr>
            
                            <tr>
                                <th class="cell-info" scope="row"><img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> on dragons</th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_printed_on_dragons" name="player_printed_on_dragons" min="0" required>
                                </td>

                                <td class="cell-info">
                                    <input type="number" id="cell_automa_cave_cards" name="automa_cave_cards" min="0" required>
                                </td>

                                <th class="cell-info">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> per <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/cave_card.png"></th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row"><img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> from <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/end_game.png"></th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_end_game_abilities" name="player_end_game_abilities" min="0" required>
                                </td>

                                <td class="cell-info">
                                    <input type="number" id="cell_automa_steps_from_last_brown_space" name="automa_steps_from_last_brown_space" min="0" required>
                                </td>

                                <th class="cell-info">Steps from last brown space</th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> per egg</th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_eggs" name="player_eggs" min="0" required>
                                </td>

                                <td class="cell-info">
                                    <input type="number" id="cell_automa_public_objectives" name="automa_public_objectives" min="0" required>
                                </td>

                                <th class="cell-info">Public objectives</th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> / cached <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/any_resource.png"></th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_cached_resources" name="player_cached_resources" min="0" required>
                                </td>
                                
                                <td class="cell-info">
                                    <input class="is_hidden" type="number" id="cell_automa_dragon_guild_fixed_vp" name="automa_dragon_guild_fixed_vp" min="0" required>
                                </td>

                                <th class="cell-info">
                                    <div id="cell_dragon_guild_fixed_vp"></div>
                                </th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> / tucked <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/dragon_card.png"></th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_tucked_cards" name="player_tucked_cards" min="0" required>
                                </td>
                                
                                <td class="cell-info"></td>

                                <th class="cell-info"></th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row"><img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> from public objectives</th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_public_objectives" name="player_public_objectives" min="0" required>
                                </td>

                                <td class="cell-info"></td>

                                <th class="cell-info"></th>
                            </tr>

                            <tr>
                                <th class="cell-info" scope="row">1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> per <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/coin.png">, <br> 1 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/victory_points.png"> per 4 <img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/any_resource.png"><img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/dragon_card.png"><img src="https://raw.githubusercontent.com/NoahBolohan/wyrmspan-utilities/refs/heads/main/static/icons/cave_card.png"></th>

                                <td class="cell-info">
                                    <input type="number" id="cell_player_remaining_resources" name="player_remaining_resources" min="0" required>
                                </td>
                                
                                <td class="cell-info"></td>

                                <th class="cell-info"></th>
                            </tr>
            
                            <tr>

                                <th class="cell-total" scope="row">Total</th>

                                <td class="cell-total">
                                    <div id="cell_player_total_score"></div>
                                </td>

                                <td class="cell-total">
                                    <div id="cell_automa_total_score"></div>
                                </td>

                                <th class="cell-total"></th>
                            </tr>
                        </tbody>
                    </table>

                </div>

                <div class="is_hidden" id="data_to_submit">
                    <input id="input_player_total_score" name="player_total_score"/>
                    <input id="input_automa_total_score" name="automa_total_score"/>
                </div>

                <div class="row gx-3" style="height:7vh;margin-bottom:1vh;" id="row_reset_submit_buttons">

                    <div class="col-6 align-self-center">
                        <button class="w-100 btn nav-button btn-reset" type="button" id="button_reset_sheet">
                            Reset score sheet
                        </button>
                    </div>

                    <div class="col-6 align-self-center">
                        <button class="w-100 btn nav-button btn-submit" id="submit" name="submit" value = "Score Sheet: Automa" access="false" type="submit">
                            Submit score
                        </button>
                    </div>
                </div>
            </div>
        </form>
    </body>
</html>
